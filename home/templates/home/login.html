{% extends "global/base.html" %} {% load static %} {% block content %}

<link rel="stylesheet" href="{% static 'css/login.css' %}">

<div class="login">
  <div id="login-container" data-url-login="{% url 'home:login' %}">
    <h1>Login</h1>

    <form id="login-form">
      <input type="email" name="email" placeholder="Email" required /><br />
      <input
        type="password"
        name="password"
        placeholder="Senha"
        required
      /><br />
      <button type="submit">Entrar</button>
    </form>
  </div>
     <p> Não tenho uma conta, <a href="{% url "home:register" %}"> cadastrar</a> </p>
</div>
<script src="{% static 'js/login.js' %}" defer></script>

{% endblock %}
